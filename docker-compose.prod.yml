# Production overlay — bind mounts data directories to host paths.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Requires: DATA_DIR set in .env (e.g. DATA_DIR=/data on VPS)
volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/postgres
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/redis
  audio_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/audio
  caddy_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/caddy
  # Los access logs viven junto al resto de los datos, no en el árbol de Docker:
  # 30 días de tráfico son 240MiB en el peor caso (20MiB × 12) y el disco que
  # importa vigilar es el mismo que ya se vigila. Sin esta entrada el volumen se
  # crearía suelto en /var/lib/docker, fuera de DATA_DIR y de cualquier copia.
  caddy_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/caddy-logs
