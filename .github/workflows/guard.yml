# The blind spot: what no test sees.
#
# Every other check in this repo answers "does the code do what it should?".
# These answer "did something get in that nobody looked at?" — a hardcoded key,
# a dependency nobody chose, a CVE published after the code was written. An
# agent that commits an API key passes the whole test suite.
#
# No `paths` filter on pull_request, deliberately: these are meant to be
# required checks, and GitHub never auto-passes a required check it filtered
# out — the PR waits forever for a status that never reports.
name: Guard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Job names are globally unique across workflows: branch protection matches
  # required checks by name alone.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. A secret deleted in the next commit is still a leaked
          # secret — it lives in the pack file, and this repo is public.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/core-api/go.mod
          cache-dependency-path: services/core-api/go.sum

      - name: gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git . --no-banner --redact --config .gitleaks.toml

  # CVEs are published after the code is written, so this fails on code that
  # was clean when it merged. It runs on push to main too: a nightly-style
  # signal that does not depend on anyone opening a PR.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/core-api/go.mod
          cache-dependency-path: services/core-api/go.sum

      # Dos cosas muy distintas se veían igual: "govulncheck falló". El
      # 2026-08-20 falló dos veces el mismo día bajando módulos de
      # proxy.golang.org — una con 403, otra con stream error — y en ninguna
      # llegó a analizar nada. No había vulnerabilidad: el paso murió antes de
      # empezar. Pero es un check requerido, su nombre dice "seguridad", y el
      # arreglo era reejecutar. Esa es exactamente la costumbre que vuelve
      # invisible un hallazgo de verdad el día que lo haya.
      #
      # Así que la red se separa del análisis. Bajar módulos es una operación de
      # red, falla como fallan las operaciones de red, y se reintenta.
      - name: Descargar módulos (la parte que es red)
        working-directory: services/core-api
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.4.0
          for intento in 1 2 3; do
            if go mod download; then exit 0; fi
            echo "::warning::go mod download falló (intento $intento de 3)"
            sleep $((intento * 10))
          done
          echo "::error::no se pudieron bajar los módulos en 3 intentos. Esto es la red, no una vulnerabilidad."
          exit 1

      # Y el análisis corre sin red que pueda fallar: con GOPROXY=off los
      # módulos están en la caché del paso anterior o no están, y eso ya no es
      # un hipo pasajero. La base de vulnerabilidades sí se consulta (vuln.go.dev
      # es una llamada directa, no pasa por el proxy de módulos).
      #
      # Un fallo de este paso vuelve a significar una sola cosa.
      - name: govulncheck
        working-directory: services/core-api
        env:
          GOPROXY: 'off'
        run: govulncheck ./...

  # The one check aimed not at the code but at how the build was made to pass.
  # Everything else here goes green when a test is deleted or turned off; this
  # goes red. No toolchain: it is grep against a committed number.
  skip-ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip budget
        run: ./scripts/check_skips.sh

  # A new dependency is the change that disappears in a diff you skim: go.sum
  # grows by twenty unreadable lines. GitHub's own dependency-review-action
  # would post the licence and known CVEs of anything added, but it needs the
  # Dependency graph switched on for the repository — a settings toggle, not
  # something a workflow can enable. Until then the guarantee lives in
  # internal/invariants: the fifteen direct requires are enumerated with a
  # reason each, and a sixteenth fails the build.
  #
  # To turn the real thing on: Settings → Advanced Security → Dependency graph,
  # then restore this job.
