name: Build & deploy frontend

# The frontend is a static Vite bundle served by Caddy from a bind mount of
# services/frontend/dist on the VPS. The build is fully self-contained (no
# VITE_* env vars — the API is same-origin /api), so it can be built here and
# rsynced into the mounted directory. Contents are replaced IN PLACE: the
# bind mount pins the dist directory's inode, so the directory itself must
# never be moved/recreated (same class of problem as the Caddyfile mount).
on:
  push:
    branches: [main]
    paths:
      - 'services/frontend/**'
      - '.github/workflows/build-frontend.yml'
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install dependencies
        working-directory: services/frontend
        run: npm ci

      - name: Build
        working-directory: services/frontend
        run: npm run build

      - name: Package dist
        run: tar czf frontend-dist.tgz -C services/frontend/dist .

      - name: Upload bundle to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: frontend-dist.tgz
          target: /tmp/

      - name: Deploy (replace dist contents in place)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /root/clinic-system
            git pull origin main
            STAGE=$(mktemp -d /tmp/frontend-dist.XXXXXX)
            tar xzf /tmp/frontend-dist.tgz -C "$STAGE"
            mkdir -p services/frontend/dist
            rsync -a --delete "$STAGE"/ services/frontend/dist/
            rm -rf "$STAGE" /tmp/frontend-dist.tgz
            echo "frontend deployed: $(ls services/frontend/dist/assets | head -3)"

  smoke:
    needs: build-deploy
    uses: ./.github/workflows/smoke.yml
    secrets: inherit
