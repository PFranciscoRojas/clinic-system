name: Build & push core-api

on:
  push:
    branches: [main]
    paths:
      - 'services/core-api/**'
      - '.github/workflows/build-core-api.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/core-api/go.mod
          cache-dependency-path: services/core-api/go.sum

      - name: Run tests
        working-directory: services/core-api
        run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/core-api/go.mod
          cache-dependency-path: services/core-api/go.sum

      - name: go vet
        working-directory: services/core-api
        run: go vet ./...

      - name: staticcheck
        working-directory: services/core-api
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...

  build:
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v6
        with:
          context: ./services/core-api
          push: true
          tags: ghcr.io/pfranciscorojas/clinic-system-core-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u pfranciscorojas --password-stdin
            cd /root/clinic-system
            git pull origin main
            docker compose pull core-api
            docker compose up -d core-api
            docker image prune -f

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install httpx
        run: pip install httpx

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 12); do
            if curl -sf https://app.chapni.com/healthz; then
              echo "API ready"
              exit 0
            fi
            echo "Waiting... ($i/12)"
            sleep 10
          done
          echo "API did not become ready in time"
          exit 1

      - name: Run smoke tests
        env:
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: python scripts/smoke_test.py
