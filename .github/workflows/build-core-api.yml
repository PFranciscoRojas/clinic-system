name: Build & push core-api

on:
  push:
    branches: [main]
    paths:
      - 'services/core-api/**'
      - '.github/workflows/build-core-api.yml'
      # The deploy job pulls this repo on the VPS and runs `compose up -d`, so
      # this file is part of what it ships. Without it here, a change to
      # core-api's environment merges green and never reaches the box: no
      # failure, no deploy, and the setting simply is not there. Same gap the
      # ai-service workflow had (PR #280).
      - 'docker-compose.yml'
  # On a PR only test+lint run: they are the gate. The build/deploy jobs are
  # skipped (see their `if`), so a PR never touches GHCR or the VPS.
  #
  # No `paths` filter here, on purpose. These checks are required by the branch
  # protection on main, and GitHub never auto-passes a required check that was
  # filtered out — it leaves the PR waiting for a status that never reports,
  # forever, with no admin override. A docs-only PR paying ~2 min of CI is the
  # cheap side of that trade. The push filter above still keeps a docs change
  # from redeploying production.
  pull_request:
  workflow_dispatch:

jobs:
  # Job names are globally unique across workflows: branch protection matches
  # required checks by name alone, so a bare `test` here and in
  # build-ai-service.yml would be ambiguous.
  core-api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/core-api/go.mod
          cache-dependency-path: services/core-api/go.sum

      # -race, matching `make test-api`. Without it the concurrency tests in
      # internal/integration still pass while a data race goes unreported: the
      # detector is the only thing that sees an unsynchronised write, and the
      # torture tests exist precisely to trigger those.
      - name: Run tests
        working-directory: services/core-api
        run: go test -race ./...

  core-api-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/core-api/go.mod
          cache-dependency-path: services/core-api/go.sum

      - name: go vet
        working-directory: services/core-api
        run: go vet ./...

      - name: staticcheck
        working-directory: services/core-api
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...

  # The ratchet. Runs `go test -short`, so no docker and no testcontainers: it
  # finishes in well under a minute and is the check that makes untested code
  # cost something.
  core-api-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/core-api/go.mod
          cache-dependency-path: services/core-api/go.sum

      - name: Coverage floors
        run: ./scripts/check_coverage.sh

  build:
    needs: [core-api-test, core-api-lint, core-api-coverage]
    # Not on pull_request. Deliberately not `== 'push'`: workflow_dispatch is
    # the manual redeploy escape hatch and must keep working.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v6
        with:
          context: ./services/core-api
          push: true
          # Two tags on purpose. `latest` is what a fresh box pulls; the SHA is
          # what makes a rollback possible at all. Until 2026-08-20 only `latest`
          # existed and the deploy pruned the previous image, so going back to
          # the version from ten minutes ago meant reverting the commit and
          # waiting for a 2.19 GB rebuild while people were locked out.
          tags: |
            ghcr.io/pfranciscorojas/clinic-system-core-api:latest
            ghcr.io/pfranciscorojas/clinic-system-core-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          # `set -e` so a failed step stops the deploy instead of carrying on
          # to the next line. Without it a migration could fail and the new
          # binary would still start, against the old schema.
          script: |
            set -e
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u pfranciscorojas --password-stdin
            cd /root/clinic-system
            git pull origin main
            docker compose pull core-api

            # Migrate BEFORE starting the new binary.
            #
            # This used to be a manual step, and the failure mode was silent:
            # the workflow went green, the new code was running, and the schema
            # it expected was not there. It happened on 000072 (PR #254) and was
            # only caught because someone thought to check.
            #
            # Before the new container, not after, because the new code is the
            # one that needs the new columns. That ordering assumes migrations
            # are additive — a migration that DROPs something the running
            # version still reads must be split across two deploys, which is the
            # normal rule for zero-downtime anyway.
            #
            # golang-migrate is idempotent: with nothing pending it prints "no
            # change" and exits 0, so every deploy runs this and almost every
            # deploy does nothing.
            set -a; . ./.env; set +a
            docker run --rm \
              -v /root/clinic-system/services/core-api/migrations:/migrations \
              --network container:sghcp_postgres \
              migrate/migrate \
              -path=/migrations/ \
              -database "postgres://$DB_USER:$DB_PASSWORD@localhost:5432/$DB_NAME?sslmode=disable" \
              up

            # A failed migration leaves schema_migrations.dirty = true, and
            # golang-migrate refuses to do anything else until a human resolves
            # it with `force <version>`. Fail the deploy loudly here rather than
            # let the next one hit a wall it did not cause.
            DIRTY=$(docker compose exec -T postgres \
              psql -U "$DB_USER" -d "$DB_NAME" -tAc \
              "SELECT dirty FROM schema_migrations")
            if [ "$DIRTY" != "f" ]; then
              echo "::error::schema_migrations is dirty — the migration failed halfway."
              echo "Resolve it by hand before deploying again (migrate ... force <version>)."
              exit 1
            fi
            echo "schema version: $(docker compose exec -T postgres psql -U "$DB_USER" -d "$DB_NAME" -tAc 'SELECT version FROM schema_migrations')"

            # Blue/green, since 2026-08-20. The colour that is NOT serving gets
            # the new image, has to report healthy on its own, and only then does
            # Caddy get pointed at it. If it never comes up the script leaves the
            # old colour serving and fails this step: no gap, and going back is a
            # config reload rather than a rebuild.
            #
            # The old colour stays up on purpose — that is the rollback. It gets
            # retired by the next deploy, which is what makes it the target.
            ./scripts/deploy_switch.sh retire || true
            ./scripts/deploy_switch.sh deploy "${{ github.sha }}"
            ./scripts/deploy_switch.sh status

            # Only images nothing has used for a week. A bare `prune -f` is what
            # deleted the previous version and left no way back.
            docker image prune -f --filter "until=168h"

  smoke:
    needs: build
    uses: ./.github/workflows/smoke.yml
    secrets: inherit
