name: Smoke test (prod)

# Reusable post-deploy smoke: called by the core-api and frontend deploy
# workflows, and runnable by hand (workflow_dispatch) after any manual change.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install httpx
        run: pip install httpx

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 12); do
            if curl -sf https://app.chapni.com/healthz; then
              echo "API ready"
              exit 0
            fi
            echo "Waiting... ($i/12)"
            sleep 10
          done
          echo "API did not become ready in time"
          exit 1

      - name: Run smoke tests
        env:
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: python scripts/smoke_test.py
