name: Check frontend types

on:
  push:
    branches: [main]
    paths:
      - 'services/frontend/**'
      - '.github/workflows/check-frontend.yml'
  # No `paths` filter — see the note in build-core-api.yml: a required check
  # that gets filtered out leaves the PR waiting on a status that never reports.
  pull_request:

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install dependencies
        working-directory: services/frontend
        run: npm ci

      - name: TypeScript check
        working-directory: services/frontend
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: services/frontend
        run: npm run lint

      - name: Unit tests
        working-directory: services/frontend
        run: npm test

      # Builds the bundle and enforces the gzipped budget. Nothing else in CI
      # would notice the app getting heavier — a slow bundle is still a correct
      # one — and the clinics using this are on Colombian mobile links.
      - name: Bundle size budget
        run: ./scripts/check_bundle_size.sh
