name: Mutation testing

# Nightly, never on a PR. Mutation testing takes tens of minutes and its result
# is a judgement about the suite's quality, not a pass/fail on a diff — putting
# it in the PR path would make every contributor wait on a check they cannot act
# on in that PR. It runs at 06:20 UTC (01:20 Bogotá), before the fuzz job at 07:00.
on:
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space-separated package paths (default: the full scoped list)'
        required: false
        default: ''
      threshold:
        description: 'Minimum efficacy percentage'
        required: false
        default: '60'

permissions:
  contents: read
  issues: write

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/core-api/go.mod
          cache-dependency-path: services/core-api/go.sum

      - name: Run mutation testing
        id: mutation
        env:
          MUTATION_THRESHOLD: ${{ github.event.inputs.threshold || '60' }}
        run: |
          set -o pipefail
          ./scripts/run_mutation.sh ${{ github.event.inputs.packages }} 2>&1 | tee mutation.log

      # The log is the deliverable: it names every surviving mutant by file and
      # line, which is the only actionable part of the run.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: mutation.log
          retention-days: 30

      # A nightly failure that only exists in the Actions tab is a nightly
      # failure nobody sees. One issue per drop, reusing an open one so a week of
      # red nights does not become seven issues.
      - name: Open an issue when efficacy drops
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('mutation.log', 'utf8'); } catch (e) {}
            const tail = log.split('\n').slice(-60).join('\n');
            const title = 'Mutation testing below threshold';
            const body = [
              `The nightly mutation run on \`${context.sha.slice(0, 7)}\` fell below the efficacy threshold.`,
              '',
              'A surviving mutant is a line the suite runs but does not check. Before writing a test for one, decide which it is:',
              '',
              '- **A real gap** — write the test.',
              '- **An equivalent mutant** — the flip cannot change behaviour (e.g. `len(r) > 24` vs `>= 24` before truncating to 24). Unkillable by definition; document it next to the test.',
              '- **Covered elsewhere** — gremlins only runs the mutated package\'s own tests, so anything pinned in `internal/integration` shows up as surviving. Not a gap.',
              '',
              '<details><summary>Run output (tail)</summary>',
              '',
              '```',
              tail,
              '```',
              '',
              '</details>',
              '',
              `[Full log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'mutation-testing',
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['mutation-testing'],
              });
            }
