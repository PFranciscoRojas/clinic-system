name: Build & push ai-service

on:
  push:
    branches: [main]
    paths:
      - 'services/ai-service/**'
      - '.github/workflows/build-ai-service.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v6
        with:
          context: ./services/ai-service
          push: true
          tags: ghcr.io/pfranciscorojas/clinic-system-ai-service:latest
          # Must match WHISPER_MODEL in the prod .env — a mismatch means the
          # container re-downloads the model at runtime after every recreate.
          build-args: WHISPER_MODEL=base
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u pfranciscorojas --password-stdin
            cd /root/clinic-system
            git pull origin main
            docker compose --profile ai pull ai-service
            docker compose --profile ai up -d ai-service
            docker image prune -f
