name: Build & push ai-service

on:
  push:
    branches: [main]
    paths:
      - 'services/ai-service/**'
      - '.github/workflows/build-ai-service.yml'
      # The deploy step does `git pull` on the VPS and then `compose up -d`,
      # which recreates the container when its configuration changed. Without
      # this line a change to the ai-service's cpu/memory limits lands on main,
      # looks deployed, and never reaches the box that needed it.
      - 'docker-compose.yml'
  # On a PR only the test job runs: it is the gate. The build/deploy job is
  # skipped (see its `if`), so a PR never touches GHCR or the VPS.
  #
  # No `paths` filter here, on purpose — see the note in build-core-api.yml: a
  # required check that gets filtered out blocks the PR forever.
  pull_request:
  workflow_dispatch:

jobs:
  # Globally unique name — branch protection matches required checks by name.
  ai-service-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # faster-whisper and its weights are deliberately NOT installed —
      # conftest.py stubs the module; no test loads a model. redis/asyncpg/cryptography are small
      # and are real imports of worker.py, which now has tests: stubbing those
      # would fake the very module under test.
      # Two steps on purpose. The runtime deps are constrained by the lock, so
      # tests run against the exact versions the image ships; a hashed
      # constraints file puts pip in --require-hashes mode, which then rejects
      # anything not in the lock — hence pytest on its own line.
      - name: Install test dependencies
        run: |
          pip install -c services/ai-service/requirements.txt pydantic-settings anthropic redis asyncpg cryptography packaging
          pip install pytest pytest-asyncio

      - name: Run tests
        working-directory: services/ai-service
        env:
          PYTHONPATH: src
        run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    needs: ai-service-test
    # Not on pull_request. Deliberately not `== 'push'`: workflow_dispatch is
    # the manual redeploy escape hatch and must keep working.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: ./services/ai-service
          push: true
          tags: ghcr.io/pfranciscorojas/clinic-system-ai-service:latest
          # Must match WHISPER_MODEL and WHISPER_COMPUTE_TYPE in the prod .env —
          # a mismatch means the container re-downloads the weights at runtime
          # after every recreate, mid-transcription, on someone's real draft.
          build-args: |
            WHISPER_MODEL=base
            WHISPER_COMPUTE_TYPE=int8
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u pfranciscorojas --password-stdin
            cd /root/clinic-system
            git pull origin main
            docker compose --profile ai pull ai-service
            docker compose --profile ai up -d ai-service
            docker image prune -f
            # Smoke check: one real, minimal Claude call from the new container
            # (src/ai_service/smoke.py). A green deploy used to mean only "the
            # container started"; from 2026-10-07 it started fine and every AI
            # call failed for 20 days. Wait for healthy first so a slow boot
            # isn't read as a broken one.
            for i in $(seq 1 24); do
              [ "$(docker inspect -f '{{.State.Health.Status}}' sghcp_ai_service)" = healthy ] && break
              sleep 5
            done
            docker exec sghcp_ai_service python -m ai_service.smoke || exit 1
