name: Build & push ai-service

on:
  push:
    branches: [main]
    paths:
      - 'services/ai-service/**'
      - '.github/workflows/build-ai-service.yml'
  # On a PR only the test job runs: it is the gate. The build/deploy job is
  # skipped (see its `if`), so a PR never touches GHCR or the VPS.
  #
  # No `paths` filter here, on purpose — see the note in build-core-api.yml: a
  # required check that gets filtered out blocks the PR forever.
  pull_request:
  workflow_dispatch:

jobs:
  # Globally unique name — branch protection matches required checks by name.
  ai-service-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # whisper/torch (~2 GB) is deliberately NOT installed — conftest.py
      # stubs it; no test loads a model.
      - name: Install test dependencies
        run: pip install pytest pytest-asyncio pydantic-settings anthropic

      - name: Run tests
        working-directory: services/ai-service
        env:
          PYTHONPATH: src
        run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    needs: ai-service-test
    # Not on pull_request. Deliberately not `== 'push'`: workflow_dispatch is
    # the manual redeploy escape hatch and must keep working.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v6
        with:
          context: ./services/ai-service
          push: true
          tags: ghcr.io/pfranciscorojas/clinic-system-ai-service:latest
          # Must match WHISPER_MODEL in the prod .env — a mismatch means the
          # container re-downloads the model at runtime after every recreate.
          build-args: WHISPER_MODEL=base
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u pfranciscorojas --password-stdin
            cd /root/clinic-system
            git pull origin main
            docker compose --profile ai pull ai-service
            docker compose --profile ai up -d ai-service
            docker image prune -f
