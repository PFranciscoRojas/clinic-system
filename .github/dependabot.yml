# Dependency updates arrive as PRs and go through the required checks; nothing
# reaches an image just because a rebuild happened (see the header of
# services/ai-service/requirements.txt for the outage that motivated this).
# Minor and patch bumps are grouped per ecosystem to keep it to one weekly PR
# each; majors come alone, because a major is where the breaking changes live.
version: 2
updates:
  - package-ecosystem: pip
    directory: /services/ai-service
    schedule: { interval: weekly, day: monday, time: "07:00", timezone: America/Bogota }
    # Bump the lock; touch pyproject only when a new version falls outside its
    # declared range (tests/test_dependency_lock.py keeps the two consistent).
    versioning-strategy: increase-if-necessary
    commit-message: { prefix: chore, include: scope }
    groups:
      ai-service-minor:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /services/core-api
    schedule: { interval: weekly, day: monday, time: "07:00", timezone: America/Bogota }
    commit-message: { prefix: chore, include: scope }
    groups:
      core-api-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /services/frontend
    schedule: { interval: weekly, day: monday, time: "07:00", timezone: America/Bogota }
    commit-message: { prefix: chore, include: scope }
    groups:
      frontend-minor:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/services/ai-service, /services/core-api]
    schedule: { interval: weekly, day: monday, time: "07:00", timezone: America/Bogota }
    commit-message: { prefix: chore, include: scope }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: chore, include: scope }
    groups:
      actions:
        patterns: ["*"]
