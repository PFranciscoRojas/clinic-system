services:
  caddy:
    image: caddy:2-alpine
    container_name: sghcp_caddy
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./services/frontend/dist:/srv/frontend:ro
    networks:
      - sghcp_net
    depends_on:
      core-api:
        condition: service_started

  core-api:
    image: ghcr.io/pfranciscorojas/clinic-system-core-api:latest
    container_name: sghcp_core_api
    restart: unless-stopped
    # Not published to the host — Caddy reaches it via the internal network
    # (core-api:8080). Publishing it would expose the whole API over plaintext
    # HTTP, bypassing TLS, the security headers, and per-IP rate limiting.
    expose:
      - "8080"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AI_SERVICE_URL: http://ai-service:8000
      AUDIO_DIR: /data/audio
    volumes:
      - audio_data:/data/audio
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - sghcp_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-service:
    image: ghcr.io/pfranciscorojas/clinic-system-ai-service:latest
    container_name: sghcp_ai_service
    restart: unless-stopped
    # Opt-in until ANTHROPIC_API_KEY exists in prod: docker compose --profile ai up -d
    profiles: ["ai"]
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DB_HOST: postgres
      DB_PORT: "5432"
    volumes:
      - audio_data:/data/audio:ro
    networks:
      - sghcp_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: sghcp_postgres
    restart: unless-stopped
    # Never published to the host: the clinical database (PHI) must only be
    # reachable on the internal network. Admin access goes through
    # `docker compose exec postgres psql` or an SSH tunnel.
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sghcp_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: sghcp_redis
    restart: unless-stopped
    # Not published to the host — only core-api reaches it on the internal
    # network. Redis holds session/invite/reset state.
    expose:
      - "6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - sghcp_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  audio_data:
  caddy_data:
  caddy_config:

networks:
  sghcp_net:
    driver: bridge
