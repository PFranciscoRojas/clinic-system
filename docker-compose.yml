# Shared definition for both core-api colours (see core-api-blue below).
x-core-api: &core-api
    image: ghcr.io/pfranciscorojas/clinic-system-core-api:${CORE_API_TAG:-latest}
    restart: unless-stopped
    # Not published to the host — Caddy reaches it by colour name on the
    # internal network (core-api-blue:8080 / core-api-green:8080). Publishing it
    # would expose the whole API over plaintext HTTP, bypassing TLS, the security
    # headers, and per-IP rate limiting.
    expose:
      - "8080"
    env_file:
      - .env
    environment: &core-api-env
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AI_SERVICE_URL: http://ai-service:8000
      AUDIO_DIR: /data/audio
      # Transcribe the session while it is still being recorded (Fase 4 of
      # docs/ai/PLAN_LATENCIA_AUDIO.md). Off unless the .env says otherwise:
      # it puts Whisper on the CPU at the moment a professional is in the room,
      # so turning it on is a decision about a specific box on a specific day.
      # Off is not a degraded mode — /audio/complete transcribes the whole take
      # either way.
      AI_WINDOW_TRANSCRIPTION: ${AI_WINDOW_TRANSCRIPTION:-false}
    volumes:
      - audio_data:/data/audio
      # NEVER mount /var/run/docker.sock here: it grants root-equivalent host
      # access to the API process (removed 2026-07-01 — Docker disk cleanup
      # runs as a weekly cron on the VPS host instead).
      - /var/lib/sghcp:/backup-status:ro
    networks:
      - sghcp_net
    # `restart: unless-stopped` brings back a process that died. It has nothing
    # to say about one that is alive and answering 502, which is the shape most
    # of this system's real outages have taken. This at least gives docker ps a
    # word for that, and scripts/monitor.sh alerts on it.
    #
    # It does not make the container recover on its own — plain compose acts on
    # no healthcheck. What actually asks whether a psychologist can work is the
    # signed-in probe in monitor.sh; this is the cheap half of the answer.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

services:
  caddy:
    image: caddy:2-alpine
    container_name: sghcp_caddy
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Which colour serves right now. One line, rewritten by
      # scripts/deploy_switch.sh and applied with `caddy reload`, which validates
      # before swapping and keeps the running config if the new one is broken.
      - ./caddy-upstream.conf:/etc/caddy/upstream.conf:ro
      - caddy_data:/data
      - caddy_config:/config
      # Access logs, 30 days. See the log block in Caddyfile: this is personal
      # data (patient UUIDs appear in the URIs) and never leaves the server.
      - caddy_logs:/var/log/caddy
      - ./services/frontend/dist:/srv/frontend:ro
    networks:
      - sghcp_net
    # No depends_on any more: there is no single core-api service to wait for,
    # and Caddy must come up even when neither colour is running — otherwise a
    # bad deploy takes the static site down with the API.

  # ── core-api, en dos colores ────────────────────────────────────────────────
  # Blue and green are the same container twice. A deploy starts the colour that
  # is NOT serving, waits for it to report healthy, and only then points Caddy at
  # it; the old one stays up for a few minutes so going back is a config reload
  # rather than an image pull.
  #
  # Measured before choosing this: core-api uses 12 MiB in production. The second
  # copy costs another twelve, against 1.3 GB free. The RAM ceiling that rules out
  # a staging stack on this box does not reach this far.
  #
  # While the switch happens both versions talk to the same database at once,
  # which is why migrations have to be additive. That rule already exists (#255).
  core-api-blue:
    <<: *core-api
    container_name: sghcp_core_api_blue
    # Which half this process is. Configuration rather than build-time, because
    # a colour is a fact about where the image was placed: the same image runs
    # as blue today and green next deploy.
    environment:
      <<: *core-api-env
      CORE_API_COLOUR: blue

  core-api-green:
    <<: *core-api
    container_name: sghcp_core_api_green
    environment:
      <<: *core-api-env
      CORE_API_COLOUR: green

  ai-service:
    image: ghcr.io/pfranciscorojas/clinic-system-ai-service:latest
    container_name: sghcp_ai_service
    restart: unless-stopped
    # Opt-in until ANTHROPIC_API_KEY exists in prod: docker compose --profile ai up -d
    profiles: ["ai"]
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DB_HOST: postgres
      DB_PORT: "5432"
    # What this container is allowed to take from a 2-vCPU / 1915 MB box that
    # also runs Postgres, Redis, Caddy and core-api.
    #
    # It had no limits at all, which was survivable only because Whisper ran
    # between sessions: the box was idle, one job took everything, nobody was
    # waiting on anything else. Transcribing *during* the session (fase 4 del
    # plan de latencia) ends that. The professional whose CPU this is competing
    # for is recording right now, and their parts have to land every minute.
    #
    # cpus 1.5 of 2: half a core is reserved for everything else. Whisper is the
    # only thing here that will take whatever it is given, and core-api becoming
    # unresponsive during a session is a worse failure than a draft arriving a
    # minute later.
    #
    # mem_limit is a ceiling, not a budget. The container sits at ~665 MB with
    # the model resident and the kernel has already killed it once for asking
    # for more than the box had (§1.1 del plan). A limit does not make that
    # cheaper, it makes it *deterministic*: the OOM killer stops choosing among
    # Postgres, Redis and this, and always chooses this. Losing a transcription
    # is recoverable; losing the database connection pool mid-session is not.
    cpus: "1.5"
    mem_limit: 1400m
    volumes:
      # rw: the worker deletes each audio file after transcription (privacy —
      # the encrypted transcript is the only copy that should persist). With
      # :ro that delete failed silently and PHI audio accumulated on disk.
      - audio_data:/data/audio
    networks:
      - sghcp_net
    # Green here means the web process answers, and nothing more. The worker
    # that turns audio into clinical notes runs beside it and can be wedged
    # while this stays 200 — that failure is caught by the consumer-group lag
    # check in scripts/monitor.sh, not here. Kept anyway because a FastAPI that
    # stops answering is real and currently invisible.
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: sghcp_postgres
    restart: unless-stopped
    # Never published to the host: the clinical database (PHI) must only be
    # reachable on the internal network. Admin access goes through
    # `docker compose exec postgres psql` or an SSH tunnel.
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sghcp_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: sghcp_redis
    restart: unless-stopped
    # Not published to the host — only core-api reaches it on the internal
    # network. Redis holds session/invite/reset state.
    expose:
      - "6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - sghcp_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  audio_data:
  caddy_data:
  caddy_config:
  caddy_logs:

networks:
  sghcp_net:
    driver: bridge
